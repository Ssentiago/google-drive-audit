[package]
name = "google-drive-audit"
version = "3.0.0"
description = "A tool for Google Drive Audit"
authors = [ "Sentiago" ]
edition = "2024"

[lib]
name = "tauri_app_lib"
crate-type = [ "staticlib", "cdylib", "rlib" ]

[build-dependencies.tauri-build]
version = "2"
features = [ ]

[dependencies]
serde_json = "1.0.145"
tiny_http = "0.12.0"
url = "2.5.7"
keyring = "3.6.3"
urlencoding = "2.1.3"
open = "5.3.2"
chrono = "0.4.42"
tauri-plugin-store = "2.4.1"
dirs = "6.0.0"
once_cell = "1.21.3"
parking_lot = "0.12.5"

  [dependencies.tauri]
  version = "2.9.2"
  features = [ ]

  [dependencies.serde]
  version = "1.0.228"
  features = [ "derive" ]

  [dependencies.reqwest]
  version = "0.12.24"
  features = [ "json" ]

  [dependencies.tokio]
  version = "1.48.0"
  features = [ "full" ]
