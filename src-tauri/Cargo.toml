[package]
name = "google-drive-audit"
version = "3.0.0"
description = "A tool for Google Drive Audit"
authors = [ "Sentiago" ]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = [ "staticlib", "cdylib", "rlib" ]

[build-dependencies.tauri-build]
version = "2.0.0"
features = [ ]

[dependencies]
serde_json = "1.0"
open = "5.3"
once_cell = "1.21"
tauri-plugin-shell = "2.3.0"
parking_lot = "0.12"
google-drive3 = "6.0.0+20240618"
google-sheets4 = "6.0.0+20240621"
yup-oauth2 = "11.0.0"
tauri-plugin-store = "2.4.0"
hyper-util = "0.1.19"
chrono = "0.4.42"
dirs = "6.0.0"
backoff = "0.4.0"
futures = "0.3.31"
governor = "0.10.2"
maplit = "1.0.2"

  [dependencies.hyper-rustls]
  version = "0.27"
  default-features = false
  features = [ "native-tokio", "http1", "ring" ]

  [dependencies.reqwest]
  version = "0.12"
  features = [ "json" ]

  [dependencies.tauri]
  version = "2.9.0"
  features = [ ]

  [dependencies.serde]
  version = "1.0"
  features = [ "derive" ]

  [dependencies.tokio]
  version = "1.48"
  features = [ "full" ]
